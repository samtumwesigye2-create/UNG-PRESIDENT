name: Security Hardening Branch

on:
  push:
    branches: [security-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run __tests__/security-headers.test.ts
      - run: npm run build
